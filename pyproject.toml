[build-system]
# PEP 639 string-form `license = "MIT"` requires setuptools >= 77 —
# older versions fail metadata validation at build time
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-search-mcp"
version = "0.5.0"
description = "MCP server for full-text search across PDF document collections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ren", email = "ren@virku.ai"}]
dependencies = [
    "PyMuPDF>=1.24.0",
    # >=1.12.0: first SDK release that serves the streamable-HTTP endpoint
    # at /mcp itself (1.11.x and older answer POST /mcp with a 307
    # redirect to /mcp/); it also has settings.transport_security, which
    # main() sets for PDF_SEARCH_ALLOWED_HOSTS
    # <2: mcp 2.x removed mcp.server.fastmcp (renamed MCPServer), which
    # mcp_server.py and tests/test_mcp_server.py import, so the server
    # fails at import; lift only after migrating both
    "mcp>=1.12.0,<2",
    "anyio>=4.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/renvk/pdf-search-mcp"
Repository = "https://github.com/renvk/pdf-search-mcp"
Issues = "https://github.com/renvk/pdf-search-mcp/issues"

[project.scripts]
pdf-search-mcp = "pdf_search_mcp.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
